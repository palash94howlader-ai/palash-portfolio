<body>

<img src="logo.jpg" alt="Palash Howlader" width="150" height="150">
<h1>Palash Howlader</h1>
<p>Ami Digital Creator</p>
<p>Ami Mathbaria theke, Ami YouTuber</p>
<p style="text-align:center;">🎥 YouTube: <a href="https://www.youtube.com/@palash94howlader" target="_blank" style="color:#FF0000; font-weight:bold;">Palash Media</a> | Page: Palashmultimedia24</p>

<div class="card">
<h2>🎨 রং বদলাও!</h2>
<button onclick="changeColor()">🎨 রং বদলাও!</button>
</div>

<div style="text-align:center; background:white; padding:25px; border-radius:20px; max-width:400px; margin:20px auto;">
<h2 style="text-align:center;">🎨 Mini Logo Maker</h2>
<p style="text-align:center;">Tomar naam lekho, Color bacho!</p>
<input id="logoText" placeholder="Tomar naam lekho" style="display:block; margin:15px auto; padding:12px; width:85%; text-align:center; border-radius:10px; border:1px solid #ccc; font-size:16px;">
<label style="display:block; text-align:center; margin-top:15px;">Color</label>
<input type="color" id="logoColor" value="#ff0000" style="display:block; margin:10px auto; width:60px; height:40px;">
<label style="display:block; text-align:center; margin-top:10px;">Design</label>
<select id="logoStyle" style="display:block; margin:10px auto; padding:12px; width:85%; text-align:center; border-radius:10px; font-size:16px;">
<option value="normal">Normal</option>
<option value="bold">Bold - Mota</option>
<option value="italic">Italic - Baka</option>
</select>
<button onclick="makeLogo()" style="display:block; margin:20px auto; background:#22c55e; color:white; padding:15px 30px; border:none; border-radius:12px; font-size:18px; width:85%;">Logo Banao</button>
<p id="logoResult" style="text-align:center; font-size:40px; margin-top:15px;"></p>
</div>

<div class="card">
<h2>🎥 Amar YouTube Video</h2>
<iframe width="100%" height="315" src="https://www.youtube.com/embed/JiJlejcUoJs" frameborder="0" allowfullscreen></iframe>
<br><br>
<a href="https://www.youtube.com/@palash94howlader" target="_blank"><button>Subscribe</button></a>
<br><br>
<a href="https://bit.ly/palash-howlader">Amar Site</a>
</div>

<script>
function changeColor() {
  var colors = ["#FF5733", "#33FF57", "#3357FF", "#FF33A1", "#FFFF33"];
  var random = colors[Math.floor(Math.random() * colors.length)];
  document.body.style.background = random;
}
function makeLogo() {
  var name = document.getElementById("logoText").value;
  var color = document.getElementById("logoColor").value;
  var style = document.getElementById("logoStyle").value;
  var result = document.getElementById("logoResult");
  if (name == "") { result.innerText = "Age naam lekho!"; return; }
  result.innerText = name;
  result.style.color = color;
  result.style.fontSize = "40px";
  if (style == "bold") { result.style.fontWeight = "bold"; result.style.fontStyle = "normal"; }
  if (style == "italic") { result.style.fontStyle = "italic"; result.style.fontWeight = "normal"; }
  if (style == "normal") { result.style.fontWeight = "normal"; result.style.fontStyle = "normal"; }
}
</script>
